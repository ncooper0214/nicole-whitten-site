# Pages CMS settings. Each "Page" entry edits the words on that page.
# Tip shown to editors: wrap words in *asterisks* for the accent style, **double asterisks** for bold.
media:
  input: public/img
  output: /img
content:
- name: posts
  label: Blog posts
  type: collection
  path: content/posts
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    primary: title
    fields:
    - title
    - category
    - date
    sort:
    - date
    - title
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Title
    type: string
    required: true
    description: 'Wrap a word or phrase in *asterisks* to make it peach and italic, like: The edit is where *copy gets good*'
  - name: category
    label: Category
    type: select
    options:
      values:
      - Copywriting
      - Editing
      - Content strategy
      - AI and automation
      - Leadership
  - name: date
    label: Publish date
    type: date
    options:
      format: yyyy-MM-dd
  - name: intro
    label: Intro line
    type: text
    description: One or two sentences shown under the title and on the blog card.
  - name: image
    label: Card image
    type: image
    description: Shown on the Blog page card (and as the featured image when this is your newest post).
  - name: image_alt
    label: Card image description
    type: string
    description: A short description of the image for screen readers.
  - name: draft
    label: Hide this post (draft)
    type: boolean
  - name: body
    label: Post
    type: rich-text
    options:
      format: markdown
